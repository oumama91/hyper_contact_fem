[mypy]
# Stubs dolfinx/petsc4py/basix incomplets ou absents : on ne bloque pas sur les imports.
ignore_missing_imports = True
# Sans base explicite, `mypy .` voit tools/capture_metrics.py sous deux noms
# (tools.capture_metrics et capture_metrics) et s'arrête avant tout contrôle.
explicit_package_bases = True
